<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ireland Music Map</title>
  <meta name="description" content="Interactive map of artists from the supplied Ireland music database.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <div id="map"></div>

    <header class="brand">
      <div class="eyebrow">IRISH EXPERIMENTAL MUSIC</div>
      <h1>Ireland Music Map</h1>
      <p>Explore the artists by place. Select a city to reveal its local scene.</p>
    </header>

    <div class="top-actions">
      <button id="resetMap">Reset view</button>
    </div>

    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search artist or city…" aria-label="Search artist or city">
      <div id="searchResults" class="search-results"></div>
    </div>

    <aside class="info-panel" id="infoPanel" aria-live="polite">
      <button class="close" id="closePanel" aria-label="Close">×</button>
      <div class="panel-kicker" id="panelKicker">SELECT A PLACE</div>
      <h2 id="panelTitle">Explore Ireland</h2>
      <p id="panelDescription">Choose a city marker or search for an artist.</p>
      <div id="artistList" class="artist-list"></div>
    </aside>

    <button class="unmapped" id="unmappedBtn">
      Other locations <span id="unmappedCount"></span>
    </button>

    <div class="legend">
      <span class="dot"></span>
      <span>artist location</span>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
